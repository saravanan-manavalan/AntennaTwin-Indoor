[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antennatwin-indoor"
version = "0.4.4.1"
description = "Indoor antenna placement and coverage optimization with verification tests"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
